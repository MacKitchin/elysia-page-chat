<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Elysia</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <button class="model-btn" id="modelBtn" type="button">
        <span id="modelLabel">Elysia</span>
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M5.3 7.3a1 1 0 0 1 1.4 0L10 10.58l3.3-3.28a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 0-1.42Z" />
        </svg>
      </button>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5Z" />
          </svg>
        </button>
        <button class="icon-btn" id="newChat" aria-label="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z" />
          </svg>
        </button>
      </div>
    </header>

    <div id="backdrop" class="drawer-backdrop hidden"></div>
    <aside id="drawer" class="drawer hidden" aria-label="Menu">
      <button class="drawer-item" id="drawerNew">New chat</button>
      <h2>This page</h2>
      <div class="page-card">
        <div id="drawerTitle">—</div>
        <div class="url" id="drawerUrl"></div>
      </div>
      <h2>Settings</h2>
      <button class="drawer-item" id="drawerTheme">Toggle theme</button>
      <button class="drawer-item" id="drawerSettings">Proxy & model…</button>
    </aside>

    <main class="thread" id="thread">
      <div class="empty" id="empty">
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="12" fill="currentColor" />
          <g fill="#fff">
            <circle cx="24" cy="14" r="3.2" />
            <circle cx="33" cy="19" r="3.2" />
            <circle cx="33" cy="29" r="3.2" />
            <circle cx="24" cy="34" r="3.2" />
            <circle cx="15" cy="29" r="3.2" />
            <circle cx="15" cy="19" r="3.2" />
            <circle cx="24" cy="24" r="3.6" />
          </g>
        </svg>
        <h1>What can I help with?</h1>
        <div class="chips" id="chips"></div>
      </div>
      <div class="messages" id="messages"></div>
    </main>

    <div id="notice" class="notice hidden"></div>

    <footer class="dock">
      <div class="context" id="contextBar">
        <span id="contextLabel">Reading this page…</span>
      </div>
      <form class="composer" id="form">
        <button class="plus" id="plusBtn" type="button" title="Use selected text" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <label class="sr-only" for="query">Message</label>
        <textarea id="query" placeholder="Ask anything" rows="1"></textarea>
        <button class="send" id="send" type="submit" disabled aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 5.8 6.4 10.4a1 1 0 0 1-1.4-1.4l6.3-6.3a1 1 0 0 1 1.4 0l6.3 6.3a1 1 0 1 1-1.4 1.4L13 5.8V20a1 1 0 1 1-2 0V5.8Z" />
          </svg>
        </button>
      </form>
      <p class="disclaimer">Elysia can make mistakes. Check important info.</p>
    </footer>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
